name: tests

on:
  pull_request:

jobs:
  godot-headless-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.6.1", "4.7.1"]
    env:
      GODOT_VERSION: ${{ matrix.godot-version }}
      MCP_SCHEMA_COMMIT: e76e9c572c6f2bfcb730357101acc90f2f802e02
      MCP_SCHEMA_SHA256: ef70b61f99b6d2e5e3b46863822eab08dff6a45bedc7a08914e0e5b133f40203
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless-capable)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${base}.zip"
          echo "Downloading $url"
          curl -fSL -o godot.zip "$url"
          unzip -q godot.zip
          mkdir -p godot-bin
          mv "$base" godot-bin/godot
          chmod +x godot-bin/godot

      - name: Print Godot version
        run: ./godot-bin/godot --version

      - name: Warm up project import (generates .godot cache)
        run: ./godot-bin/godot --headless --path . --import || true

      - name: Run headless test suite
        run: GODOT="$PWD/godot-bin/godot" ./addons/godot_mcp/run_tests.sh

      - name: Install pinned conformance test dependency
        run: python -m pip install --requirement tests/protocol/requirements.txt

      - name: Fetch pinned official MCP schema
        run: |
          url="https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/${MCP_SCHEMA_COMMIT}/schema/2026-07-28/schema.json"
          curl -fsSL "$url" -o /tmp/mcp-2026-07-28-schema.json
          echo "${MCP_SCHEMA_SHA256}  /tmp/mcp-2026-07-28-schema.json" | sha256sum --check

      - name: Run legacy and modern wire conformance matrix
        run: python tests/protocol/test_wire_conformance.py --godot "$PWD/godot-bin/godot" --schema /tmp/mcp-2026-07-28-schema.json
